name: Publish Mathe-Spiele
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'almas-mathe-spiele-offline.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Include portable offline edition
        run: cp almas-mathe-spiele-offline.html web/almas-mathe-spiele-offline.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
